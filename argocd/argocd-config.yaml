apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:VictorMalodPortfolio/Homelab.git
    targetRevision: main
    path: helm/argocd-config
    helm:
      valueFiles:
        - secrets://secrets.sops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
