apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-ovh
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://aureq.github.io/cert-manager-webhook-ovh/
      chart: cert-manager-webhook-ovh
      targetRevision: 0.9.5
      helm:
        valueFiles:
          - $values/helm/cert-manager-webhook-ovh/values.yaml
    - repoURL: git@github.com:VictorMalodPortfolio/Homelab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
