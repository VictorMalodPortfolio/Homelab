name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'

env:
  IMAGE: ghcr.io/victormalodportfolio/argocd-repo-server

jobs:
  conventional-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      packages: read
    container:
      image: ghcr.io/victormalodportfolio/k8s-tooling:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          git log origin/main..HEAD --no-merges --format="%s" | while read msg; do
            if ! echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|ci|build)(\(.+\))?: .+'; then
              echo "Invalid commit message: $msg"
              echo "Expected format: <type>(optional scope): <description>"
              echo "Allowed types: feat, fix, docs, chore, refactor, test, ci, build"
              exit 1
            fi
          done

  trivy-image:
    name: Scan repo-server image
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: docker/argocd-repo-server
          push: false
          tags: ${{ env.IMAGE }}:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:latest
          format: sarif
          output: trivy-results-image.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-image.sarif
          category: trivy-image

      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  build-and-push:
    name: Build and push repo-server image
    runs-on: ubuntu-latest
    needs: trivy-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if SHA tag already exists
        id: tag-check
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short-sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          SHA_TAG="${{ env.IMAGE }}:sha-$SHORT_SHA"
          if docker manifest inspect "$SHA_TAG" > /dev/null 2>&1; then
            echo "Tag $SHA_TAG already exists in GHCR, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.tag-check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: docker/argocd-repo-server
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.tag-check.outputs.short-sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

      - name: Run Trivy (gate)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  changelog:
    name: Update CHANGELOG
    runs-on: ubuntu-latest
    needs: [trivy, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: Protected
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/victormalodportfolio/k8s-tooling:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.LAB_BOT_ID }}
          private-key: ${{ secrets.LAB_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate CHANGELOG
        run: git-cliff --output CHANGELOG.md

      - name: Commit and push
        run: |
          git diff --quiet CHANGELOG.md && echo "No changes, skipping." && exit 0
          git config user.name "Homelab Portfolio Bot[bot]"
          git config user.email "homelab-portfolio-bot[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG"
          git push
