# Ignore a finding only with a statement saying why it doesn't apply.
#
# HIGH vulnerabilities in the upstream binaries of the repo-server image (ArgoCD's
# helm, kustomize and git-lfs, plus sops and age) don't need an entry: the CI gate
# only blocks on fixable OS packages and on CRITICAL, and reports the rest to the
# Security tab (see the trivy-image job in .github/workflows/ci.yml).

vulnerabilities:
  # Go crypto/tls: a resumed TLS session can skip a CA check when the program
  # mutates its tls.Config between handshakes. Rated CRITICAL, so it trips the gate.
  # Found in the git-lfs and kustomize binaries ArgoCD v3.5.6 ships, built with
  # Go 1.25.3 and 1.24.0.
  - id: CVE-2025-68121
    paths:
      - usr/local/bin/git-lfs
      - usr/local/bin/kustomize
    expired_at: 2027-02-01
    statement: >-
      The Homelab uses neither Git LFS nor kustomize: every app is a Helm chart.
      The flaw also needs a program that mutates tls.Config between handshakes,
      which these one-shot CLI runs don't. Drop this entry once ArgoCD ships both
      rebuilt with Go 1.25.7 or later.

misconfigurations:
  # argocd-cm contains a $secret-name:key reference, not an actual secret
  - id: KSV-0109
    statement: The clientSecret value in argocd-cm is a reference ($argocd-oidc-secret:key), not a plaintext secret.
